<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="theme-color" content="#22c55e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="食材ログ">
<meta name="mobile-web-app-capable" content="yes">
<meta name="description" content="写真から食材の種類・量・日付を記録">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<title>食材フォトログ</title>
<style>
  :root {
    --green: #22c55e; --green-dark: #16a34a; --green-light: #dcfce7;
    --red: #ef4444; --gray: #6b7280; --gray-light: #f3f4f6;
    --border: #e5e7eb; --radius: 12px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f8fafc; color: #1e293b; }

  header { background: var(--green); color: #fff; padding: 16px 20px; display: flex; align-items: center; gap: 10px; position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 8px rgba(34,197,94,.3); }
  header svg.logo { width: 28px; height: 28px; flex-shrink: 0; }
  header h1 { font-size: 1.2rem; font-weight: 700; flex: 1; }
  header button.gear { background: rgba(255,255,255,.2); border: none; border-radius: 8px; padding: 6px; cursor: pointer; color: #fff; line-height: 0; }
  header button.gear:hover { background: rgba(255,255,255,.35); }

  .tabs { display: flex; background: #fff; border-bottom: 1px solid var(--border); position: sticky; top: 60px; z-index: 99; }
  .tab { flex: 1; padding: 14px; text-align: center; font-size: .9rem; font-weight: 600; color: var(--gray); cursor: pointer; border-bottom: 3px solid transparent; transition: .2s; }
  .tab.active { color: var(--green-dark); border-bottom-color: var(--green); }

  .panel { display: none; padding: 20px; max-width: 600px; margin: 0 auto; }
  .panel.active { display: block; }

  #install-banner { display: none; align-items: center; gap: 12px; background: #fff; border-bottom: 1px solid var(--border); padding: 12px 20px; }
  #install-banner button.add { background: var(--green); color: white; border: none; border-radius: 8px; padding: 8px 14px; font-size: .85rem; font-weight: 600; cursor: pointer; }
  #install-banner button.close { background: none; border: none; color: #9ca3af; cursor: pointer; font-size: 1.2rem; line-height: 1; padding: 4px; }

  .upload-area { border: 2px dashed var(--border); border-radius: var(--radius); text-align: center; padding: 32px 20px; background: #fff; cursor: pointer; transition: .2s; position: relative; }
  .upload-area:hover { border-color: var(--green); background: var(--green-light); }
  .upload-area input { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%; }
  .upload-area svg { width: 48px; height: 48px; color: var(--green); margin-bottom: 12px; }
  .upload-area strong { color: var(--green-dark); font-size: 1rem; display: block; margin-bottom: 6px; }
  .upload-area p { color: var(--gray); font-size: .9rem; }

  #preview-wrap { display: none; margin-top: 16px; }
  #preview-wrap img { width: 100%; border-radius: var(--radius); max-height: 300px; object-fit: cover; }

  .btn { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; padding: 14px; border: none; border-radius: var(--radius); font-size: 1rem; font-weight: 600; cursor: pointer; transition: .2s; margin-top: 12px; }
  .btn-primary { background: var(--green); color: #fff; }
  .btn-primary:hover { background: var(--green-dark); }
  .btn-primary:disabled { background: #94d3a2; cursor: not-allowed; }
  .btn-secondary { background: var(--gray-light); color: #374151; }
  .btn-secondary:hover { background: var(--border); }
  .btn-sm { padding: 6px 12px; font-size: .8rem; width: auto; margin: 0; }

  .date-row { display: flex; align-items: center; gap: 10px; margin-top: 16px; background: #fff; border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 16px; }
  .date-row label { font-size: .85rem; font-weight: 600; color: var(--gray); white-space: nowrap; }
  .date-row input[type=date] { border: none; font-size: .95rem; flex: 1; outline: none; color: #1e293b; }

  .spinner { display: inline-block; width: 20px; height: 20px; border: 3px solid rgba(255,255,255,.4); border-top-color: #fff; border-radius: 50%; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .section-title { font-size: .85rem; font-weight: 700; color: var(--gray); text-transform: uppercase; letter-spacing: .05em; margin: 20px 0 10px; }
  .ingredient-card { background: #fff; border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; margin-bottom: 8px; display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; }
  .ingredient-card .name-input { border: none; font-size: 1rem; font-weight: 600; color: #1e293b; outline: none; width: 100%; background: transparent; }
  .ingredient-card .qty-row { display: flex; gap: 6px; align-items: center; grid-column: 1 / -1; }
  .ingredient-card input[type=number] { width: 80px; border: 1px solid var(--border); border-radius: 6px; padding: 4px 8px; font-size: .9rem; }
  .ingredient-card .unit-input { border: 1px solid var(--border); border-radius: 6px; padding: 4px 8px; font-size: .9rem; width: 70px; }
  .del-btn { background: none; border: none; cursor: pointer; color: #cbd5e1; padding: 4px; line-height: 1; }
  .del-btn:hover { color: var(--red); }
  .add-row { display: flex; gap: 8px; margin-top: 6px; }
  .add-row input { flex: 1; border: 1px solid var(--border); border-radius: 8px; padding: 10px 14px; font-size: .9rem; outline: none; }
  .add-row input:focus { border-color: var(--green); }

  .history-date-group { margin-bottom: 20px; }
  .history-date-label { font-size: .85rem; font-weight: 700; color: var(--gray); margin-bottom: 8px; display: flex; align-items: center; gap: 6px; }
  .history-date-label::after { content: ''; flex: 1; height: 1px; background: var(--border); }
  .history-item { background: #fff; border: 1px solid var(--border); border-radius: 10px; padding: 12px 16px; margin-bottom: 6px; display: flex; align-items: center; justify-content: space-between; }
  .history-item .info { flex: 1; }
  .history-item .name { font-weight: 600; font-size: .95rem; }
  .history-item .meta { font-size: .82rem; color: var(--gray); margin-top: 2px; }

  #toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(60px); background: #1e293b; color: #fff; padding: 12px 20px; border-radius: 100px; font-size: .9rem; font-weight: 500; transition: .3s; z-index: 1000; white-space: nowrap; opacity: 0; }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  #toast.error { background: var(--red); }

  .empty { text-align: center; padding: 48px 20px; color: var(--gray); }
  .empty svg { width: 48px; height: 48px; opacity: .4; display: block; margin: 0 auto 12px; }

  .modal-backdrop { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 200; align-items: flex-end; }
  .modal-backdrop.open { display: flex; }
  .modal { background: #fff; border-radius: 20px 20px 0 0; padding: 24px 20px 40px; width: 100%; max-width: 600px; margin: 0 auto; }
  .modal h2 { font-size: 1.1rem; font-weight: 700; margin-bottom: 6px; }
  .modal p.desc { font-size: .85rem; color: var(--gray); margin-bottom: 20px; line-height: 1.5; }
  .modal label { display: block; font-size: .85rem; font-weight: 600; color: var(--gray); margin-bottom: 6px; }
  .modal input[type=password] { width: 100%; border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; font-size: .95rem; outline: none; font-family: monospace; }
  .modal input:focus { border-color: var(--green); }
  .modal .modal-actions { display: flex; gap: 10px; margin-top: 16px; }
  .key-status { font-size: .82rem; margin-top: 8px; height: 18px; }
  .key-status.ok { color: var(--green-dark); }
  .key-status.ng { color: var(--red); }

  /* Stock tab */
  .action-row { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
  .btn-warning { background: #f97316; color: #fff; }
  .btn-warning:hover { background: #ea580c; }
  .btn-warning:disabled { background: #fdba74; cursor: not-allowed; }

  .stock-item { background: #fff; border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; margin-bottom: 6px; display: flex; align-items: center; gap: 10px; }
  .stock-item input[type=checkbox] { width: 20px; height: 20px; flex-shrink: 0; accent-color: var(--green); }
  .stock-item .info { flex: 1; min-width: 0; }
  .stock-item .name { font-weight: 600; font-size: .95rem; }
  .stock-item .meta { font-size: .78rem; color: var(--gray); margin-top: 2px; }
  .badge { font-size: .72rem; font-weight: 700; padding: 3px 8px; border-radius: 100px; white-space: nowrap; flex-shrink: 0; }
  .badge-expired { background: #fee2e2; color: var(--red); }
  .badge-soon { background: #ffedd5; color: #c2410c; }
  .badge-ok { background: var(--green-light); color: var(--green-dark); }

  .recipe-appliance-label { font-size: .85rem; font-weight: 700; color: var(--green-dark); margin: 18px 0 8px; display: flex; align-items: center; gap: 6px; }
  .recipe-appliance-label:first-child { margin-top: 0; }
  .recipe-card { background: #fff; border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; margin-bottom: 8px; }
  .recipe-card .recipe-name { font-weight: 700; font-size: 1rem; margin-bottom: 6px; }
  .recipe-card .recipe-veggies { font-size: .8rem; color: var(--gray); margin-bottom: 10px; }
  .recipe-card ol { padding-left: 20px; font-size: .85rem; line-height: 1.6; }
</style>
</head>
<body>

<header>
  <svg class="logo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
    <path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/>
    <polyline points="9 22 9 12 15 12 15 22"/>

  <h1>食材フォトログ</h1>
  <button class="gear" onclick="openSettings()">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">

      <path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/>
    </svg>

<div class="tabs">
  <div class="tab active" onclick="switchTab('record')">
    <svg style="width:16px;height:16px;vertical-align:middle;margin-right:4px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M12 8v8M8 12h8"/></svg>
    記録する
  </div>
  <div class="tab" onclick="switchTab('stock')">
    <svg style="width:16px;height:16px;vertical-align:middle;margin-right:4px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2"/><rect x="9" y="3" width="6" height="4" rx="1"/><path d="M9 12h6M9 16h6"/></svg>
    在庫
  </div>
</div>

<div id="install-banner">
  <svg width="36" height="36" viewBox="0 0 36 36" style="flex-shrink:0"><rect width="36" height="36" rx="8" fill="#22c55e"/><path d="M18 10v12M12 16l6 6 6-6" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
  <div style="flex:1;min-width:0"><div style="font-weight:700;font-size:.9rem">ホーム画面に追加</div><div style="font-size:.8rem;color:#6b7280">アプリとして使えます</div></div>

<!-- 記録パネル -->

  <label class="upload-area" id="upload-area">

  <div id="preview-wrap">

<!-- 設定モーダル -->
<div class="modal-backdrop" id="settings-modal" onclick="if(event.target===this)closeSettings()">
  <div class="modal">
    <h2>設定</h2>
    <p class="desc">Anthropic APIキーを入力してください。キーはこのデバイスのみに保存され、外部サーバーには送信されません。</p>

<div id="toast"></div>

<script>
const STORAGE_KEY = 'food-log-records';
const API_KEY_STORAGE = 'food-log-api-key';
const CLAUDE_API = 'https://api.anthropic.com/v1/messages';
const EXPIRY_WARNING_DAYS = 3;
const DEFAULT_SHELF_LIFE = 7;
const APPLIANCE_ORDER = ['Panasonicビストロ', 'Panasonicオートクッカー', 'ビタクラフト'];

// 野菜ごとの目安賞味期限（日）。該当しない野菜はDEFAULT_SHELF_LIFEを使用。
const VEGETABLE_SHELF_LIFE = {
  'キャベツ': 14, 'レタス': 7, 'トマト': 7, 'ミニトマト': 10, 'きゅうり': 5, 'なす': 5,
  'ピーマン': 7, 'パプリカ': 10, 'にんじん': 14, '大根': 14, 'じゃがいも': 30, 'さつまいも': 21,
  '玉ねぎ': 30, '長ねぎ': 10, 'ねぎ': 10, 'ほうれん草': 4, '小松菜': 4, '白菜': 14,
  'ブロッコリー': 5, 'カリフラワー': 7, 'もやし': 3, 'しいたけ': 7, 'しめじ': 7, 'えのき': 7,
  'まいたけ': 7, 'きのこ': 7, 'アスパラガス': 5, 'ごぼう': 14, 'れんこん': 10, 'かぼちゃ': 14,
  'にんにく': 30, 'しょうが': 21, 'セロリ': 10, 'パセリ': 7, 'バジル': 5, 'とうもろこし': 3,
  'オクラ': 5, 'ズッキーニ': 7, 'かぶ': 7, 'ゴーヤ': 7
};

function getShelfLifeDays(name) {
  if (VEGETABLE_SHELF_LIFE[name] != null) return VEGETABLE_SHELF_LIFE[name];
  const match = Object.keys(VEGETABLE_SHELF_LIFE).find(k => name.includes(k) || k.includes(name));
  return match ? VEGETABLE_SHELF_LIFE[match] : DEFAULT_SHELF_LIFE;
}

function addDays(dateStr, days) {
  const d = new Date(dateStr + 'T00:00:00');
  d.setDate(d.getDate() + days);
  return d.toISOString().slice(0, 10);
}

function daysUntil(dateStr) {
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const target = new Date(dateStr + 'T00:00:00');
  return Math.round((target - today) / 86400000);
}

let selectedFile = null;
let ingredients = [];

document.getElementById('record-date').value = new Date().toISOString().slice(0, 10);

window.addEventListener('load', () => {
  if (!localStorage.getItem(API_KEY_STORAGE)) openSettings();
  renderStock();
});

// ---- Settings ----
function openSettings() {
  const key = localStorage.getItem(API_KEY_STORAGE) || '';
  document.getElementById('api-key-input').value = key;
  updateKeyStatus(key);
  document.getElementById('settings-modal').classList.add('open');
}
function closeSettings() { document.getElementById('settings-modal').classList.remove('open'); }

function updateKeyStatus(key) {
  const el = document.getElementById('key-status');
  if (!key) { el.textContent = ''; el.className = 'key-status'; return; }
  if (key.startsWith('sk-ant-')) {
    el.textContent = '✓ キーが設定されています';
    el.className = 'key-status ok';
  } else {
    el.textContent = '⚠ sk-ant- で始まるキーを確認してください';
    el.className = 'key-status ng';
  }
}
document.getElementById('api-key-input').addEventListener('input', e => updateKeyStatus(e.target.value.trim()));

function saveSettings() {
  const key = document.getElementById('api-key-input').value.trim();
  if (!key) { showToast('APIキーを入力してください', true); return; }
  localStorage.setItem(API_KEY_STORAGE, key);
  closeSettings();
  showToast('APIキーを保存しました');
}

// ---- Image resize ----
function resizeImage(file, maxPx = 1024) {
  return new Promise(resolve => {
    const img = new Image();
    img.onload = () => {
      let w = img.width, h = img.height;
      if (w > maxPx || h > maxPx) {
        if (w > h) { h = Math.round(h * maxPx / w); w = maxPx; }
        else { w = Math.round(w * maxPx / h); h = maxPx; }
      }
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      canvas.toBlob(resolve, 'image/jpeg', 0.85);
    };
    img.src = URL.createObjectURL(file);
  });
}

function blobToBase64(blob) {
  return new Promise(resolve => {
    const r = new FileReader();
    r.onload = () => resolve(r.result.split(',')[1]);
    r.readAsDataURL(blob);
  });
}

// ---- Upload ----
function onFileSelect(input) {
  const file = input.files[0];
  if (!file) return;
  selectedFile = file;
  document.getElementById('preview-img').src = URL.createObjectURL(file);
  document.getElementById('preview-wrap').style.display = 'block';
  document.getElementById('upload-area').style.display = 'none';
  document.getElementById('ingredients-section').style.display = 'none';
  ingredients = [];
}

function resetUpload() {
  selectedFile = null;
  document.getElementById('file-input').value = '';
  document.getElementById('preview-wrap').style.display = 'none';
  document.getElementById('upload-area').style.display = '';
  document.getElementById('ingredients-section').style.display = 'none';
  ingredients = [];
}

// ---- Analyze ----
async function analyzeImage() {
  const apiKey = localStorage.getItem(API_KEY_STORAGE);
  if (!apiKey) { openSettings(); showToast('まずAPIキーを設定してください', true); return; }
  if (!selectedFile) return;

  const btn = document.getElementById('analyze-btn');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> 解析中...';

  try {
    const resized = await resizeImage(selectedFile);
    const b64 = await blobToBase64(resized);

    const res = await fetch(CLAUDE_API, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'x-api-key': apiKey,
        'anthropic-version': '2023-06-01',
        'anthropic-dangerous-direct-browser-access': 'true'
      },
      body: JSON.stringify({
        model: 'claude-haiku-4-5-20251001',
        max_tokens: 1024,
        messages: [{
          role: 'user',
          content: [
            { type: 'image', source: { type: 'base64', media_type: 'image/jpeg', data: b64 } },
            { type: 'text', text: 'この写真に写っている野菜を全て検出してください。JSON形式のみで返してください。{"ingredients":[{"name":"野菜名","quantity":数値またはnull,"unit":"単位（g/個/本/枚/袋/パック/束など）"}]}' }
          ]
        }]
      })
    });

    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      if (res.status === 401) { openSettings(); showToast('APIキーが無効です。確認してください', true); }
      else showToast(err.error?.message || `エラー (${res.status})`, true);
      return;
    }

    const data = await res.json();
    let text = data.content[0].text.trim();
    if (text.includes('```')) { text = text.split('```')[1]; if (text.startsWith('json')) text = text.slice(4); }
    ingredients = JSON.parse(text).ingredients || [];
    renderIngredients();
    document.getElementById('ingredients-section').style.display = 'block';
    if (!ingredients.length) showToast('野菜が検出されませんでした。手動で追加できます');
  } catch (e) {
    showToast('解析に失敗しました: ' + e.message, true);
  } finally {
    btn.disabled = false;
    btn.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg> 野菜を解析する';
  }
}

// ---- Ingredient list ----
function renderIngredients() {
  const list = document.getElementById('ingredient-list');
  list.innerHTML = '';
  ingredients.forEach((item, i) => {
    const card = document.createElement('div');
    card.className = 'ingredient-card';
    card.innerHTML = `
      <input class="name-input" value="${esc(item.name)}" oninput="ingredients[${i}].name=this.value" placeholder="野菜名">
      <button class="del-btn" onclick="removeIngredient(${i})">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
      <div class="qty-row">
        <input type="number" min="0" step="0.1" value="${item.quantity ?? ''}" oninput="ingredients[${i}].quantity=this.value?parseFloat(this.value):null" placeholder="量">
        <input class="unit-input" value="${esc(item.unit||'')}" oninput="ingredients[${i}].unit=this.value" placeholder="単位">
      </div>`;
    list.appendChild(card);
  });
}

function removeIngredient(i) { ingredients.splice(i, 1); renderIngredients(); }

function addIngredient() {
  const input = document.getElementById('new-ingredient-name');
  const name = input.value.trim();
  if (!name) return;
  ingredients.push({ name, quantity: null, unit: '' });
  renderIngredients();
  input.value = '';
}

// ---- Save ----
function saveRecords() {
  const valid = ingredients.filter(i => i.name.trim());
  if (!valid.length) { showToast('野菜名を入力してください', true); return; }
  const recordDate = document.getElementById('record-date').value;
  const records = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
  valid.forEach(item => {
    const name = item.name.trim();
    records.push({
      id: Date.now() + Math.random(),
      record_date: recordDate,
      ingredient: name,
      quantity: item.quantity ?? null,
      unit: item.unit || '',
      expiry_date: addDays(recordDate, getShelfLifeDays(name)),
      created_at: new Date().toISOString()
    });
  });
  localStorage.setItem(STORAGE_KEY, JSON.stringify(records));
  showToast(`${valid.length}件の野菜を保存しました！`);
  resetUpload();
  document.getElementById('ingredients-section').style.display = 'none';
  ingredients = [];
}

// ---- Stock ----
function switchTab(tab) {
  document.querySelectorAll('.tab').forEach((t, i) => t.classList.toggle('active', (i === 0) === (tab === 'record')));
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  document.getElementById('panel-' + tab).classList.add('active');
  if (tab === 'stock') renderStock();
}

function renderStock() {
  const records = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
  const el = document.getElementById('stock-list');
  const markBtn = document.getElementById('mark-used-btn');

  if (!records.length) {
    el.innerHTML = '<div class="empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2"/><rect x="9" y="3" width="6" height="4" rx="1"/></svg><p>在庫はありません</p></div>';
    markBtn.style.display = 'none';
    return;
  }
  markBtn.style.display = '';

  const sorted = [...records].sort((a, b) => (a.expiry_date || '').localeCompare(b.expiry_date || ''));
  el.innerHTML = '';
  sorted.forEach(r => {
    const d = r.expiry_date ? daysUntil(r.expiry_date) : null;
    let badgeClass = 'badge-ok', badgeText = '-';
    if (d != null) {
      if (d < 0) { badgeClass = 'badge-expired'; badgeText = `期限切れ(${-d}日前)`; }
      else if (d <= EXPIRY_WARNING_DAYS) { badgeClass = 'badge-soon'; badgeText = `あと${d}日`; }
      else { badgeText = `あと${d}日`; }
    }
    const qty = r.quantity != null ? `${r.quantity}${r.unit || ''}` : (r.unit || '');
    const row = document.createElement('div');
    row.className = 'stock-item';
    row.innerHTML = `
      <input type="checkbox" class="stock-check" value="${r.id}">
      <div class="info">
        <div class="name">${esc(r.ingredient)}${qty ? ` <span style="color:var(--gray);font-weight:400;font-size:.85rem">(${esc(qty)})</span>` : ''}</div>
        <div class="meta">購入: ${r.record_date} ・ 期限: ${r.expiry_date || '-'}</div>
      </div>
      <span class="badge ${badgeClass}">${badgeText}</span>
      <button class="del-btn" onclick="deleteStockItem('${r.id}')" title="削除">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/></svg>
      </button>`;
    el.appendChild(row);
  });
}

function deleteStockItem(id) {
  const records = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]').filter(r => String(r.id) !== String(id));
  localStorage.setItem(STORAGE_KEY, JSON.stringify(records));
  renderStock();
  showToast('削除しました');
}

function markUsedSelected() {
  const checked = [...document.querySelectorAll('.stock-check:checked')].map(c => c.value);
  if (!checked.length) { showToast('使用した野菜を選択してください', true); return; }
  const records = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]').filter(r => !checked.includes(String(r.id)));
  localStorage.setItem(STORAGE_KEY, JSON.stringify(records));
  renderStock();
  showToast(`${checked.length}件を使用済みにしました`);
}

// ---- Recipe suggestions ----
async function suggestRecipes(urgentOnly) {
  const apiKey = localStorage.getItem(API_KEY_STORAGE);
  if (!apiKey) { openSettings(); showToast('まずAPIキーを設定してください', true); return; }

  const records = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
  let targets = records;
  if (urgentOnly) {
    targets = records.filter(r => r.expiry_date && daysUntil(r.expiry_date) <= EXPIRY_WARNING_DAYS);
    if (!targets.length) { showToast('期限が近い野菜はありません'); return; }
  } else if (!targets.length) {
    showToast('在庫がありません', true);
    return;
  }

  const btn = document.getElementById(urgentOnly ? 'expiring-btn' : 'suggest-btn');
  const otherBtn = document.getElementById(urgentOnly ? 'suggest-btn' : 'expiring-btn');
  const originalHtml = btn.innerHTML;
  btn.disabled = true; otherBtn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> レシピを考えています...';

  try {
    const lines = targets.map(r => {
      const qty = r.quantity != null ? `${r.quantity}${r.unit || ''}` : (r.unit || '適量');
      return `- ${r.ingredient} ${qty}（購入日:${r.record_date}, 期限:${r.expiry_date}）`;
    }).join('\n');

    const prompt = `次の野菜を使った料理を提案してください。

【手持ちの野菜】
${lines}

【条件】
- 使用する調理器具ごとに提案を分け、必ず次の順番で出力してください:
  1. Panasonicビストロ（オーブンレンジ）
  2. Panasonicオートクッカー
  3. ビタクラフト（鍋・フライパンなどの通常調理器具）
- 各調理器具について1〜2件のレシピを提案してください
${urgentOnly ? '- これらの野菜は期限が近い、または過ぎています。必ず使い切るレシピにしてください\n' : ''}- 以下のJSON形式のみで返答してください（説明文不要）:
{"recipes":[{"appliance":"Panasonicビストロ","name":"レシピ名","vegetables_used":["野菜名"],"steps":["手順1","手順2"]}]}`;

    const res = await fetch(CLAUDE_API, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'x-api-key': apiKey,
        'anthropic-version': '2023-06-01',
        'anthropic-dangerous-direct-browser-access': 'true'
      },
      body: JSON.stringify({
        model: 'claude-sonnet-4-6',
        max_tokens: 2048,
        messages: [{ role: 'user', content: prompt }]
      })
    });

    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      if (res.status === 401) { openSettings(); showToast('APIキーが無効です', true); }
      else showToast(err.error?.message || `エラー (${res.status})`, true);
      return;
    }

    const data = await res.json();
    let text = data.content[0].text.trim();
    if (text.includes('```')) { text = text.split('```')[1]; if (text.startsWith('json')) text = text.slice(4); }
    const recipes = JSON.parse(text).recipes || [];
    renderRecipes(recipes);
  } catch (e) {
    showToast('レシピ提案に失敗しました: ' + e.message, true);
  } finally {
    btn.disabled = false; otherBtn.disabled = false;
    btn.innerHTML = originalHtml;
  }
}

function renderRecipes(recipes) {
  const sorted = [...recipes].sort((a, b) => {
    const ai = APPLIANCE_ORDER.findIndex(x => (a.appliance || '').includes(x) || x.includes(a.appliance || ''));
    const bi = APPLIANCE_ORDER.findIndex(x => (b.appliance || '').includes(x) || x.includes(b.appliance || ''));
    return (ai < 0 ? 99 : ai) - (bi < 0 ? 99 : bi);
  });

  const el = document.getElementById('recipe-list');
  el.innerHTML = '';
  if (!sorted.length) {
    el.innerHTML = '<p style="color:var(--gray);font-size:.9rem">レシピが見つかりませんでした</p>';
  } else {
    let lastAppliance = null;
    sorted.forEach(r => {
      if (r.appliance !== lastAppliance) {
        const label = document.createElement('div');
        label.className = 'recipe-appliance-label';
        label.textContent = r.appliance;
        el.appendChild(label);
        lastAppliance = r.appliance;
      }
      const card = document.createElement('div');
      card.className = 'recipe-card';
      const veggies = (r.vegetables_used || []).map(esc).join('、');
      const steps = (r.steps || []).map(s => `<li>${esc(s)}</li>`).join('');
      card.innerHTML = `
        <div class="recipe-name">${esc(r.name)}</div>
        <div class="recipe-veggies">使用する野菜: ${veggies}</div>
        <ol>${steps}</ol>`;
      el.appendChild(card);
    });
  }
  const results = document.getElementById('recipe-results');
  results.style.display = 'block';
  results.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

// ---- PWA ----
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js').catch(() => {}));
}
let deferredPrompt = null;
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault(); deferredPrompt = e;
  document.getElementById('install-banner').style.display = 'flex';
});
function installApp() {
  if (!deferredPrompt) return;
  deferredPrompt.prompt();
  deferredPrompt.userChoice.then(() => { deferredPrompt = null; document.getElementById('install-banner').style.display = 'none'; });
}
window.addEventListener('appinstalled', () => {
  document.getElementById('install-banner').style.display = 'none';
  showToast('アプリをインストールしました！');
});

// ---- Util ----
function esc(s) {
  return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
function showToast(msg, isError = false) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'show' + (isError ? ' error' : '');
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.className = '', 3000);
}
</script>
